name: Audited checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: TypeScript build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile
        run: npm run build

  test:
    name: Hop-gate tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run test suite
        run: npm test

  license:
    name: License metadata consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: package.json license matches LICENSE file
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const lic = fs.readFileSync('LICENSE', 'utf8');
            if (pkg.license !== 'BUSL-1.1') {
              console.error('package.json license must be BUSL-1.1, got: ' + pkg.license);
              process.exit(1);
            }
            if (!lic.includes('Business Source License')) {
              console.error('LICENSE file is not Business Source License');
              process.exit(1);
            }
            console.log('license metadata OK: BUSL-1.1');
          "
